<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gárgolas Community | MauroAKD</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Syncopate:wght@700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg-dark: #050505;
  --gold-main: #d4af37;
  --gold-gradient: linear-gradient(135deg,#bf953f,#fcf6ba,#b38728,#fbf5b7,#aa771c);
  --card-bg: rgba(255,255,255,0.02);
  --card-border: rgba(212,175,55,0.12);
  --text-gray:#a0a0a0;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg-dark);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;}

.navbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:15px 5%;border-bottom:1px solid var(--card-border);
}
.nav-tabs{display:flex;gap:10px;}
.tab-btn{
  background:none;border:1px solid var(--card-border);
  color:var(--text-gray);padding:8px 14px;border-radius:20px;cursor:pointer;
}
.tab-btn.active{background:var(--gold-gradient);color:#000;}

.main-content{max-width:1100px;margin:20px auto;padding:0 15px;}

.section-box{
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:16px;padding:20px;margin-bottom:20px;
}

.shop-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:10px;
}

.shop-item{
  border:1px solid var(--card-border);
  border-radius:10px;padding:10px;text-align:center;
}

.btn-kick{
  background:var(--gold-gradient);
  border:none;padding:8px 12px;border-radius:8px;cursor:pointer;
}

.success-message{
  background:rgba(0,255,0,0.1);
  padding:10px;margin:10px 0;border-radius:8px;
}
.error-message{
  background:rgba(255,0,0,0.1);
  padding:10px;margin:10px 0;border-radius:8px;
}
</style>
</head>

<body>

<nav class="navbar">
<div>GARGOLAS COMMUNITY</div>
<div class="nav-tabs">
  <button class="tab-btn active" onclick="switchTab(event,'home')">Home</button>
  <button class="tab-btn" onclick="switchTab(event,'shop')">Shop</button>
  <button class="tab-btn" onclick="switchTab(event,'leaderboard');loadLeaderboard()">Ranking</button>
</div>
<button class="btn-kick" onclick="loginKick()">Conectar Kick</button>
</nav>

<div class="main-content">

<div id="msgContainer"></div>

<section id="home" class="section-box">
<div id="userView" style="display:none">
  <h3>Bienvenido <span id="userName"></span></h3>
  <h2 id="userPoints">0</h2>

  <button class="btn-kick" onclick="claimDaily()">¡PRESENTE!</button>
  <h3>Racha: <span id="streakVal">0</span></h3>
</div>

<div id="guestView">
  <p>Inicia sesión para participar</p>
</div>
</section>

<section id="shop" class="section-box" style="display:none">
<h3>Tienda</h3>
<div class="shop-grid" id="shopGrid"></div>
</section>

<section id="leaderboard" class="section-box" style="display:none">
<h3>Ranking</h3>
<div id="leaderboardContent">Cargando...</div>
</section>

</div>

<script>

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "gargolascommunity.firebaseapp.com",
  projectId: "gargolascommunity"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const BACKEND_URL = "https://gargolas-backend.onrender.com";

const rewards = [
  { name: "Sub Kick", price: 8000 },
  { name: "Nitro Discord", price: 10000 },
  { name: "Juego Steam", price: 20000 },
  { name: "Moderador", price: 100000 }
];

function renderShop() {
  document.getElementById("shopGrid").innerHTML = rewards.map(r => `
    <div class="shop-item">
      <h4>${r.name}</h4>
      <p>${r.price} pts</p>
      <button class="btn-kick" onclick="buyItem('${r.name}',${r.price})">
        CANJEAR
      </button>
    </div>
  `).join("");
}

async function buyItem(name, price) {
  if (!auth.currentUser) return notify("Debes loguearte","error");

  const username = auth.currentUser.displayName;

  const res = await fetch(`${BACKEND_URL}/api/redeem`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ username, item:name, price })
  });

  const data = await res.json();

  if(data.success) notify(data.alert);
  else notify(data.error,"error");
}

async function claimDaily(){
  const username = auth.currentUser.displayName;

  const res = await fetch(`${BACKEND_URL}/api/presente`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ username })
  });

  const data = await res.json();

  if(data.success){
    notify(`Racha: ${data.streak} (+${data.bonusPoints} pts)`);
  } else {
    notify(data.error,"error");
  }
}

async function loadLeaderboard(){
  const res = await fetch(`${BACKEND_URL}/api/leaderboard`);
  const data = await res.json();

  document.getElementById("leaderboardContent").innerHTML =
    data.map((u,i)=>`#${i+1} ${u.username} - ${u.points} pts`).join("<br>");
}

function notify(msg,type="success"){
  document.getElementById("msgContainer").innerHTML =
    `<div class="${type}-message">${msg}</div>`;
}

function switchTab(e,id){
  document.querySelectorAll("section").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";

  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  e.currentTarget.classList.add("active");
}

function loginKick(){
  window.location.href = `${BACKEND_URL}/auth/kick`;
}

auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("userView").style.display="block";
    document.getElementById("guestView").style.display="none";

    const username = user.displayName;
    document.getElementById("userName").textContent = username;

    db.collection("users").doc(username).onSnapshot(doc=>{
      if(doc.exists){
        document.getElementById("userPoints").textContent =
          doc.data().points || 0;

        document.getElementById("streakVal").textContent =
          doc.data().streak || 0;
      }
    });

    fetch(`${BACKEND_URL}/api/start-watching`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ username })
    });
  }
});

document.addEventListener("DOMContentLoaded",()=>{
  renderShop();

  const token = new URLSearchParams(location.search).get("token");
  if(token){
    auth.signInWithCustomToken(token).then(()=>{
      history.replaceState({},'',"/");
    });
  }
});

</script>
</body>
</html>
