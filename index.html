<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gárgolas Community | MauroAKD</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #08080a;
            --bg-card: rgba(18, 18, 22, 0.7);
            --gold-main: #d4af37;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 70%, #aa771c 100%);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --border-color: rgba(212, 175, 55, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
        }

        /* --- NAVBAR --- */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 8%; background: rgba(8, 8, 10, 0.8);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }

        .brand {
            font-family: 'Syncopate', sans-serif; font-size: 1.2rem;
            letter-spacing: 3px; background: var(--gold-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .nav-tabs { display: flex; gap: 10px; }

        .tab-btn {
            background: transparent; border: none; color: var(--text-dim);
            padding: 10px 18px; border-radius: 12px; cursor: pointer;
            font-weight: 600; transition: var(--transition);
            display: flex; align-items: center; gap: 8px;
        }

        .tab-btn.active {
            background: var(--gold-gradient); color: #000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        /* --- CONTENIDO --- */
        .main-content { max-width: 1000px; margin: 40px auto; padding: 0 20px; }

        .section-box {
            background: var(--bg-card); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: 24px;
            padding: 35px; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- STATS --- */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px; }
        .stat-card {
            background: rgba(255,255,255,0.03); padding: 20px;
            border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); text-align: center;
        }
        .val-big {
            font-size: 2.5rem; font-weight: 800; background: var(--gold-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* --- SHOP --- */
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; }
        .shop-item {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border-color);
            padding: 20px; border-radius: 18px; text-align: center; transition: var(--transition);
        }
        .shop-item:hover { transform: translateY(-5px); border-color: var(--gold-main); }

        /* --- BUTTONS --- */
        .btn-gold {
            background: var(--gold-gradient); color: #000; border: none;
            padding: 14px 24px; border-radius: 12px; font-weight: 800;
            cursor: pointer; transition: var(--transition); width: 100%;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-gold:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- NOTIFS --- */
        #msgContainer { position: fixed; top: 90px; right: 20px; z-index: 1000; width: 320px; }
        .notif {
            padding: 15px 20px; border-radius: 12px; margin-bottom: 10px;
            border-left: 4px solid; animation: slideIn 0.3s ease-out;
            background: #1a1a1a; color: #fff;
        }
        .success { border-color: #00ff78; }
        .error { border-color: #ff4646; }

        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        /* --- RANKING --- */
        .rank-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .rank-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="brand">GÁRGOLAS</div>
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab(event,'home')"><i data-lucide="home" size="18"></i></button>
        <button class="tab-btn" onclick="switchTab(event,'shop')"><i data-lucide="shopping-bag" size="18"></i></button>
        <button class="tab-btn" onclick="switchTab(event,'leaderboard');loadLeaderboard()"><i data-lucide="trophy" size="18"></i></button>
    </div>
    <button class="btn-gold" id="loginBtn" onclick="loginKick()" style="width: auto; padding: 8px 15px; font-size: 0.7rem;">Conectar Kick</button>
</nav>

<div class="main-content">
    <div id="msgContainer"></div>

    <section id="home" class="section-box">
        <div id="userView" style="display:none">
            <p style="color: var(--text-dim); font-size: 0.8rem;">Bienvenido,</p>
            <h1 id="userName" style="margin-bottom: 20px;">Cargando...</h1>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <p>Puntos</p>
                    <div id="userPoints" class="val-big">0</div>
                </div>
                <div class="stat-card">
                    <p>Racha 🔥</p>
                    <div id="streakVal" class="val-big">0</div>
                </div>
            </div>
            <button class="btn-gold" id="btnPresente" onclick="claimDaily()" style="margin-top: 25px;">¡DAR PRESENTE!</button>
        </div>

        <div id="guestView" style="text-align: center;">
            <i data-lucide="crown" size="48" style="color: var(--gold-main); margin-bottom: 15px;"></i>
            <h2>Comunidad Gárgolas</h2>
            <p style="color: var(--text-dim); margin-top: 10px;">Conecta tu cuenta para empezar a ganar premios por ver el stream.</p>
        </div>
    </section>

    <section id="shop" class="section-box" style="display:none">
        <h3>Tienda de Premios</h3>
        <div class="shop-grid" id="shopGrid"></div>
    </section>

    <section id="leaderboard" class="section-box" style="display:none">
        <h3>Top Guerreros</h3>
        <table class="rank-table" id="leaderboardContent"></table>
    </section>
</div>

<script>
    lucide.createIcons();

    // --- CONFIGURACIÓN (REMPLAZA TU API KEY) ---
    const firebaseConfig = {
        apiKey: "TU_API_KEY_AQUI",
        authDomain: "gargolascommunity.firebaseapp.com",
        projectId: "gargolascommunity"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // IMPORTANTE: Asegúrate de que esta URL no termine en "/"
    const BACKEND_URL = "https://gargolas-backend.onrender.com";

    const rewards = [
        { name: "Sub Kick", price: 8000, icon: "star" },
        { name: "Nitro Discord", price: 10000, icon: "zap" },
        { name: "Juego Steam", price: 20000, icon: "gamepad-2" },
        { name: "Moderador", price: 100000, icon: "shield" }
    ];

    // --- LÓGICA DE TIENDA ---
    function renderShop() {
        document.getElementById("shopGrid").innerHTML = rewards.map(r => `
            <div class="shop-item">
                <i data-lucide="${r.icon}" style="color:var(--gold-main)"></i>
                <h4 style="margin: 10px 0">${r.name}</h4>
                <p style="color:var(--gold-main); font-weight:800; margin-bottom:15px">${r.price.toLocaleString()} pts</p>
                <button class="btn-gold" onclick="buyItem('${r.name}',${r.price})">Canjear</button>
            </div>
        `).join("");
        lucide.createIcons();
    }

    async function buyItem(item, price) {
        if (!auth.currentUser) return notify("Inicia sesión primero", "error");
        
        try {
            const res = await fetch(`${BACKEND_URL}/api/redeem`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: auth.currentUser.displayName, item, price })
            });
            const data = await res.json();
            if (data.success) notify(data.alert, "success");
            else notify(data.error, "error");
        } catch (e) {
            notify("Error de conexión con el servidor", "error");
        }
    }

    // --- LÓGICA DE PUNTOS ---
    async function claimDaily() {
        const btn = document.getElementById("btnPresente");
        btn.disabled = true;
        try {
            const res = await fetch(`${BACKEND_URL}/api/presente`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: auth.currentUser.displayName })
            });
            const data = await res.json();
            if (data.success) notify(`¡Racha de ${data.streak} días! +${data.bonusPoints} pts`, "success");
            else notify(data.error, "error");
        } catch (e) {
            notify("Error al reclamar", "error");
        } finally {
            btn.disabled = false;
        }
    }

    async function loadLeaderboard() {
        const table = document.getElementById("leaderboardContent");
        table.innerHTML = "Cargando...";
        try {
            const res = await fetch(`${BACKEND_URL}/api/leaderboard`);
            const data = await res.json();
            table.innerHTML = data.map((u, i) => `
                <tr>
                    <td style="color:var(--gold-main); font-weight:800">#${i+1}</td>
                    <td>${u.username}</td>
                    <td style="text-align:right">${u.points.toLocaleString()} PTS</td>
                </tr>
            `).join("");
        } catch (e) {
            table.innerHTML = "Error al cargar ranking";
        }
    }

    // --- SISTEMA DE LATIDO (HEARTBEAT) ---
    function startHeartbeat(username) {
        // Enviar señal al backend inmediatamente y luego cada 20 min
        const sendSignal = () => {
            fetch(`${BACKEND_URL}/api/start-watching`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username })
            }).catch(e => console.log("Stream offline o error de red"));
        };

        sendSignal();
        setInterval(sendSignal, 20 * 60 * 1000);
    }

    // --- NAVEGACIÓN Y AUTH ---
    function notify(msg, type) {
        const id = Date.now();
        const container = document.getElementById("msgContainer");
        container.insertAdjacentHTML('beforeend', `<div id="${id}" class="notif ${type}">${msg}</div>`);
        setTimeout(() => document.getElementById(id)?.remove(), 4000);
    }

    function switchTab(e, id) {
        document.querySelectorAll("section").forEach(s => s.style.display = "none");
        document.getElementById(id).style.display = "block";
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        e.currentTarget.classList.add("active");
    }

    function loginKick() {
        window.location.href = `${BACKEND_URL}/auth/kick`;
    }

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById("userView").style.display = "block";
            document.getElementById("guestView").style.display = "none";
            document.getElementById("loginBtn").style.display = "none";
            document.getElementById("userName").textContent = user.displayName;

            // Escuchar puntos en tiempo real desde Firebase
            db.collection("users").doc(user.displayName).onSnapshot(doc => {
                if (doc.exists) {
                    document.getElementById("userPoints").textContent = (doc.data().points || 0).toLocaleString();
                    document.getElementById("streakVal").textContent = doc.data().streak || 0;
                }
            });

            startHeartbeat(user.displayName);
        }
    });

    // Manejo de Token tras login
    document.addEventListener("DOMContentLoaded", () => {
        renderShop();
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");
        if (token) {
            auth.signInWithCustomToken(token).then(() => {
                window.history.replaceState({}, document.title, "/");
            }).catch(err => notify("Error al iniciar sesión", "error"));
        }
    });
</script>

</body>
</html>
