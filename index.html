<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gárgolas Community | MauroAKD</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #08080a;
            --bg-card: rgba(18, 18, 22, 0.7);
            --gold-main: #d4af37;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 70%, #aa771c 100%);
            --accent-glow: rgba(212, 175, 55, 0.15);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --border-color: rgba(212, 175, 55, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* --- NAVBAR PREMIUM --- */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 8%;
            background: rgba(8, 8, 10, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100;
        }

        .brand {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 3px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .nav-tabs { display: flex; gap: 15px; }

        .tab-btn {
            background: transparent; border: 1px solid transparent;
            color: var(--text-dim); padding: 10px 20px;
            border-radius: 12px; cursor: pointer;
            font-weight: 600; transition: var(--transition);
            display: flex; align-items: center; gap: 8px;
        }

        .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }

        .tab-btn.active {
            background: var(--gold-gradient);
            color: #000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        /* --- LAYOUT --- */
        .main-content { max-width: 1200px; margin: 40px auto; padding: 0 20px; }

        .section-box {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 24px; padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- USER CARD --- */
        .user-stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;
        }

        .stat-card {
            background: rgba(255,255,255,0.03);
            padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .points-display {
            font-size: 3rem; font-weight: 800; margin: 10px 0;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- SHOP GRID --- */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px; margin-top: 25px;
        }

        .shop-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 20px; padding: 25px;
            transition: var(--transition);
            position: relative; overflow: hidden;
        }

        .shop-item:hover {
            transform: translateY(-5px);
            background: rgba(212, 175, 55, 0.05);
            border-color: var(--gold-main);
        }

        .shop-item h4 { font-size: 1.2rem; margin-bottom: 10px; }
        .shop-item .price { color: var(--gold-main); font-weight: 800; font-size: 1.4rem; margin-bottom: 20px; }

        /* --- BUTTONS --- */
        .btn-kick {
            background: var(--gold-gradient);
            color: #000; border: none; padding: 12px 24px;
            border-radius: 12px; font-weight: 800;
            cursor: pointer; transition: var(--transition);
            text-transform: uppercase; letter-spacing: 1px;
            width: 100%;
        }

        .btn-kick:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        /* --- NOTIFICATIONS --- */
        #msgContainer {
            position: fixed; top: 100px; right: 20px; z-index: 1000; width: 300px;
        }

        .success-message, .error-message {
            padding: 15px 20px; border-radius: 12px; margin-bottom: 10px;
            backdrop-filter: blur(10px); border-left: 4px solid;
            animation: slideIn 0.3s ease-out;
        }

        .success-message { background: rgba(0, 255, 120, 0.1); border-color: #00ff78; color: #aaffd4; }
        .error-message { background: rgba(255, 70, 70, 0.1); border-color: #ff4646; color: #ffbaba; }

        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* --- LEADERBOARD --- */
        .leaderboard-table { width: 100%; border-collapse: collapse; }
        .leaderboard-row {
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: var(--transition);
        }
        .leaderboard-row:hover { background: rgba(255,255,255,0.02); }
        .leaderboard-row td { padding: 15px; }
        .rank-number { font-weight: 800; color: var(--gold-main); width: 50px; }

    </style>
</head>

<body>

<nav class="navbar">
    <div class="brand">GÁRGOLAS</div>
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab(event,'home')">
            <i data-lucide="home" size="18"></i> Home
        </button>
        <button class="tab-btn" onclick="switchTab(event,'shop')">
            <i data-lucide="shopping-bag" size="18"></i> Shop
        </button>
        <button class="tab-btn" onclick="switchTab(event,'leaderboard');loadLeaderboard()">
            <i data-lucide="trophy" size="18"></i> Ranking
        </button>
    </div>
    <div style="width: 180px;">
        <button class="btn-kick" onclick="loginKick()" style="font-size: 0.8rem;">
            Conectar Kick
        </button>
    </div>
</nav>

<div class="main-content">
    <div id="msgContainer"></div>

    <section id="home" class="section-box">
        <div id="userView" style="display:none">
            <p style="color: var(--text-dim); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px;">Bienvenido, Guerrero</p>
            <h1 id="userName" style="font-size: 2.5rem; margin-bottom: 30px;">-</h1>
            
            <div class="user-stats-grid">
                <div class="stat-card">
                    <p style="color: var(--text-dim)">Puntos Totales</p>
                    <div id="userPoints" class="points-display">0</div>
                </div>
                <div class="stat-card">
                    <p style="color: var(--text-dim)">Racha Actual</p>
                    <div class="points-display" style="font-size: 2rem;">
                        <span id="streakVal">0</span> 🔥
                    </div>
                </div>
            </div>

            <button class="btn-kick" onclick="claimDaily()" style="margin-top: 30px; padding: 20px;">
                ¡DAR PRESENTE AHORA!
            </button>
        </div>

        <div id="guestView" style="text-align: center; padding: 40px 0;">
            <i data-lucide="lock" size="48" style="color: var(--gold-main); margin-bottom: 20px;"></i>
            <h2>Acceso Restringido</h2>
            <p style="color: var(--text-dim); margin-bottom: 30px;">Inicia sesión con tu cuenta de Kick para empezar a ganar puntos.</p>
            <button class="btn-kick" onclick="loginKick()" style="max-width: 300px;">Conectar con Kick</button>
        </div>
    </section>

    <section id="shop" class="section-box" style="display:none">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h3>Tienda de Recompensas</h3>
            <span style="color: var(--gold-main); font-weight: 600;">Intercambia tus puntos</span>
        </div>
        <div class="shop-grid" id="shopGrid"></div>
    </section>

    <section id="leaderboard" class="section-box" style="display:none">
        <h3 style="margin-bottom: 30px;">Top Guerreros</h3>
        <table class="leaderboard-table">
            <tbody id="leaderboardContent">
                </tbody>
        </table>
    </section>
</div>

<script>
    // Inicializar Iconos
    lucide.createIcons();

    const firebaseConfig = {
        apiKey: "TU_API_KEY",
        authDomain: "gargolascommunity.firebaseapp.com",
        projectId: "gargolascommunity"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const BACKEND_URL = "https://gargolas-backend.onrender.com";

    const rewards = [
        { name: "Sub Kick", price: 8000, icon: "star" },
        { name: "Nitro Discord", price: 10000, icon: "zap" },
        { name: "Juego Steam", price: 20000, icon: "gamepad-2" },
        { name: "Moderador", price: 100000, icon: "shield-check" }
    ];

    function renderShop() {
        document.getElementById("shopGrid").innerHTML = rewards.map(r => `
            <div class="shop-item">
                <i data-lucide="${r.icon}" style="color: var(--gold-main); margin-bottom: 15px;"></i>
                <h4>${r.name}</h4>
                <p class="price">${r.price.toLocaleString()} pts</p>
                <button class="btn-kick" onclick="buyItem('${r.name}',${r.price})">
                    CANJEAR
                </button>
            </div>
        `).join("");
        lucide.createIcons();
    }

    async function loadLeaderboard(){
        const content = document.getElementById("leaderboardContent");
        content.innerHTML = "Cargando...";
        
        try {
            const res = await fetch(`${BACKEND_URL}/api/leaderboard`);
            const data = await res.json();

            content.innerHTML = data.map((u, i) => `
                <tr class="leaderboard-row">
                    <td class="rank-number">#${i+1}</td>
                    <td style="font-weight: 600;">${u.username}</td>
                    <td style="text-align: right; color: var(--gold-main); font-weight: 800;">${u.points.toLocaleString()} PTS</td>
                </tr>
            `).join("");
        } catch (e) {
            content.innerHTML = "Error al cargar el ranking";
        }
    }

    // --- EL RESTO DE TUS FUNCIONES SE MANTIENEN IGUAL (buyItem, claimDaily, notify, etc.) ---
    
    async function buyItem(name, price) {
        if (!auth.currentUser) return notify("Debes loguearte","error");
        const username = auth.currentUser.displayName;
        const res = await fetch(`${BACKEND_URL}/api/redeem`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({ username, item:name, price })
        });
        const data = await res.json();
        if(data.success) notify(data.alert);
        else notify(data.error,"error");
    }

    async function claimDaily(){
        if (!auth.currentUser) return;
        const username = auth.currentUser.displayName;
        const res = await fetch(`${BACKEND_URL}/api/presente`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({ username })
        });
        const data = await res.json();
        if(data.success) notify(`¡Presente! Racha: ${data.streak} (+${data.bonusPoints} pts)`);
        else notify(data.error,"error");
    }

    function notify(msg, type="success"){
        const id = Date.now();
        const container = document.getElementById("msgContainer");
        const html = `<div id="notif-${id}" class="${type}-message">${msg}</div>`;
        container.insertAdjacentHTML('beforeend', html);
        setTimeout(() => {
            const el = document.getElementById(`notif-${id}`);
            if(el) el.remove();
        }, 4000);
    }

    function switchTab(e, id){
        document.querySelectorAll("section").forEach(s => s.style.display="none");
        document.getElementById(id).style.display="block";
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        e.currentTarget.classList.add("active");
    }

    function loginKick(){
        window.location.href = `${BACKEND_URL}/auth/kick`;
    }

    auth.onAuthStateChanged(user => {
        if(user){
            document.getElementById("userView").style.display="block";
            document.getElementById("guestView").style.display="none";
            const username = user.displayName;
            document.getElementById("userName").textContent = username;

            db.collection("users").doc(username).onSnapshot(doc => {
                if(doc.exists){
                    document.getElementById("userPoints").textContent = (doc.data().points || 0).toLocaleString();
                    document.getElementById("streakVal").textContent = doc.data().streak || 0;
                }
            });

            fetch(`${BACKEND_URL}/api/start-watching`,{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body: JSON.stringify({ username })
            });
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        renderShop();
        const token = new URLSearchParams(location.search).get("token");
        if(token){
            auth.signInWithCustomToken(token).then(() => {
                history.replaceState({},'',"/");
            });
        }
    });
</script>

</body>
</html>
